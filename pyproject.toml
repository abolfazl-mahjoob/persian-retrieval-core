[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "persian-retrieval-core"
version = "0.1.0"
description = "Dependency-light Persian text normalization, semantic chunking, lexical search and result fusion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abolfazl Mahjoob" }]
keywords = ["persian", "farsi", "retrieval", "search", "rag", "rrf", "text"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "build>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/persian_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
